name: Buyer Radar 7 - Public Buyer Discovery
on:
  workflow_dispatch:
  schedule:
    - cron: '15 6,12 * * *'
permissions:
  contents: write
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan public RSS sources
        run: python scripts/buyer_radar_7.py
      - name: Commit public results only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add buyer-radar-7.json buyer-radar-7.csv buyer-radar-7-diagnostics.txt
          git diff --cached --quiet || (git commit -m 'Update Buyer Radar 7 public opportunities' && git push)
