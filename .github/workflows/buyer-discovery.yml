
name: Daily Buyer Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  discover-buyers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Search public buyer requests
        run: |
          python - <<'PY'
          import urllib.parse
          import urllib.request
          import xml.etree.ElementTree as ET
          import csv
          from datetime import datetime, timezone

          searches = [
              '"looking to buy a car" "Cape Town"',
              '"looking for a bakkie" "Western Cape"',
              '"car wanted" "Paarl"',
              '"looking for a car" "Stellenbosch"',
              '"vehicle wanted" "Western Cape"'
          ]

          results = []
          seen = set()

          for query in searches:
              params = urllib.parse.urlencode({
                  "q": query,
                  "hl": "en-ZA",
                  "gl": "ZA",
                  "ceid": "ZA:en"
              })
              url = "https://news.google.com/rss/search?" + params

              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(
                      req, timeout=20
                  ) as response:
                      root = ET.fromstring(response.read())

                  for item in root.findall(".//item"):
                      title = item.findtext("title", "")
                      link = item.findtext("link", "")
                      date = item.findtext("pubDate", "")

                      if link and link not in seen:
                          seen.add(link)
                          results.append([query, title, link, date])

              except Exception as error:
                  print("Search failed:", query, error)

          with open(
              "buyer_discovery_results.csv",
              "w",
              newline="",
              encoding="utf-8"
          ) as file:
              writer = csv.writer(file)
              writer.writerow([
                  "Search", "Title", "Public URL", "Published"
              ])
              writer.writerows(results)

          print("Search completed:",
                datetime.now(timezone.utc).isoformat())
          print("Public search results found:", len(results))
          PY

      - name: Save search results
        uses: actions/upload-artifact@v4
        with:
          name: buyer-discovery-results
          path: buyer_discovery_results.csv
          retention-days: 30
