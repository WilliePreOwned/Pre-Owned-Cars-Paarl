
name: Daily Buyer Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'

permissions:
  contents: read

jobs:
  discover-buyers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Search for buyer opportunities
        run: python scripts/discover.py

      - name: Save buyer opportunity report
        uses: actions/upload-artifact@v4
        with:
          name: buyer-opportunities
          path: buyer_opportunities.csv
          retention-days: 30
