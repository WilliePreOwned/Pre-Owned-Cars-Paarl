name: Hourly Buyer Discovery

on:
  workflow_dispatch:
    inputs:
      send_test_email:
        description: 'Send SMTP test email (does not require a buyer lead)'
        required: false
        type: boolean
        default: false
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

concurrency:
  group: willie-buyer-radar
  cancel-in-progress: false

jobs:
  discover-buyers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore previously seen lead IDs
        id: seen
        uses: actions/cache/restore@v4
        with:
          path: buyer_radar_seen.json
          key: buyer-radar-seen-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            buyer-radar-seen-
      - name: Run Buyer Discovery 4.0
        run: python scripts/discover.py
      - name: Save seen lead IDs for next run
        uses: actions/cache/save@v4
        with:
          path: buyer_radar_seen.json
          key: buyer-radar-seen-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Email new leads or send a test background: 
        if: if: ${{ false }}${{ steps.seen.outputs.cache-matched-key != '' || inputs.send_test_email == true }}
        env:
          ALERT_TO: williec@westvaal.co.za
          SMTP_HOST: ${{ secrets.RADAR_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.RADAR_SMTP_PORT }}
          SMTP_USER: ${{ secrets.RADAR_SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.RADAR_SMTP_PASSWORD }}
          SEND_TEST_EMAIL: ${{ inputs.send_test_email }}
        run: python scripts/email_alerts.py
      - name: Upload buyer reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buyer-opportunities-v4
          path: |
            buyer_opportunities_v3.csv
            buyer_discovery_diagnostics.txt
          if-no-files-found: warn
