
name: Hourly Buyer Discovery

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read

jobs:
  discover-buyers:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Buyer Discovery 3.0
        run: python scripts/discover.py

      - name: Save Buyer Discovery 3.0 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: buyer-opportunities-v3
          path: |
            buyer_opportunities_v3.csv
            buyer_discovery_diagnostics.txt
          if-no-files-found: warn
          retention-days: 30
